name: CI

on:
  push:
    branches: [main, pages-demo]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Python checks
        run: |
          python -m ruff check backend tools
          python -m ruff format --check backend tools
      - name: Backend tests (pytest)
        run: python -m pytest backend/tests -q
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Route planner test (demo + NASA mission data, PNG decoder from src/core/png.js)
        run: |
          node tools/test-planner.mjs
          node tools/test-planner.mjs data/missions/mount-sharp
          node tools/test-planner.mjs data/missions/jezero
      - name: EVA regression tests
        run: node --test tools/test-eva.mjs
      - name: Translation test (PL/EN)
        run: node tools/test-i18n.mjs
